	<defs id="fonts">
		<style>
			@font-face {
				font-family: Nimbus Sans L;
				font-weight: normal;
				font-style: normal;
				src: url("../fonts/NimbusSanL-Reg.ttf") format("ttf");
			}
			@font-face {
				font-family: Nimbus Sans L;
				font-weight: bold;
				font-style: normal;
				src: url("../fonts/NimbusSanL-Bol.ttf") format("ttf");
			}
		</style>
	</defs>
	<circle id="white_inner" cx="50%" cy="50%" r="8.00" fill="#ffffff"/>
	
	<circle if="outer" cx="50%" cy="50%" r="8.00" style="display:inline;fill:none;fill-opacity:0.0;stroke:#000000;stroke-width:1.00;stroke-dasharray:none;stroke-opacity:1"></circle>
	
	<text x="50%" y="72%" style="font-size:12px;font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;text-anchor:middle;fill:#000000;fill-opacity:1;font-family:Nimbus Sans L">2</text>
