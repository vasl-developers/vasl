	</defs>
	
	<defs>
		<symbol id="ca_arrow">
			<!-- If used at 100% zoon, X & Y position is -15.00,-7.00 from "center" of arrow (e.g., upper left corner of the draw box -->
			<path style="display:inline;fill:#ff0000;stroke:none;stroke-width:0.00;stroke-opacity:0.00" d="M 15.00,1.00 29.00,9.00 23.00,9.00 23.00,13.00 7.00,13.00 7.00,9.00 1.00,9.00 Z"/>
		</symbol>		
	</defs>

	<use style="display:inline" xlink:href="#ca_arrow" x="15.00" y="23.00" transform="rotate(90,41.00,41.00)"/>
	<text x="42.00" y="8.75" transform="rotate(-90,42.00,8.75)" style="font-size:15.00px;font-style:normal;font-variant:normal;font-weight:bold;font-stretch:condensed;text-anchor:end;fill:#000000;fill-opacity:1;font-family:Nimbus Sans L">&#43;4&#43;6</text>
