				<use style="display:inline" xlink:href="#plank" x="82.00" y="90.00"/>
				<use style="display:inline" xlink:href="#plank" x="82.00" y="105.00"/>
				<use style="display:inline" xlink:href="#joint" x="125.00" y="105.00"/>
				<use style="display:inline" xlink:href="#plank" x="82.00" y="120.00"/>
				<use style="display:inline" xlink:href="#plank" x="82.00" y="135.00"/>
				<use style="display:inline" xlink:href="#joint" x="95.00" y="135.00"/>
				<use style="display:inline" xlink:href="#plank" x="82.00" y="150.00"/>
				<use style="display:inline" xlink:href="#plank" x="82.00" y="165.00"/>
				<use style="display:inline" xlink:href="#joint" x="123.00" y="165.00"/>
				<use style="display:inline" xlink:href="#plank" x="82.00" y="180.00"/>
				<use style="display:inline" xlink:href="#plank" x="82.00" y="195.00"/>
				<use style="display:inline" xlink:href="#joint" x="114.00" y="195.00"/>
				<use style="display:inline" xlink:href="#plank" x="82.00" y="210.00"/>
				<use style="display:inline" xlink:href="#plank" x="82.00" y="225.00"/>
