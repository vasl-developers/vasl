			<rect x="2.00" y="2.00" height="2.00" width="2.00" style="display:inline;fill:#000000;fill-opacity:1;stroke:none;stroke-width:1.0;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:0.00"/>
			<rect x="72.00" y="2.00" height="2.00" width="2.00" style="display:inline;fill:#000000;fill-opacity:1;stroke:none;stroke-width:1.0;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:0.00"/>
			<rect x="2.00" y="11.00" height="2.00" width="2.00" style="display:inline;fill:#000000;fill-opacity:1;stroke:none;stroke-width:1.0;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:0.00"/>
			<rect x="72.00" y="11.00" height="2.00" width="2.00" style="display:inline;fill:#000000;fill-opacity:1;stroke:none;stroke-width:1.0;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:0.00"/>
		</symbol>
		<symbol id="joint" width="11.00" height="15.00">
			<rect x="2.00" y="2.00" height="2.00" width="2.00" style="display:inline;fill:#000000;fill-opacity:1;stroke:none;stroke-width:1.0;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:0.00"/>
			<rect x="8.00" y="2.00" height="2.00" width="2.00" style="display:inline;fill:#000000;fill-opacity:1;stroke:none;stroke-width:1.0;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:0.00"/>
			<line x1="6.00" y1="0.00" x2="6.00" y2="15.00" stroke="#000000" stroke-width="1.00" />			
			<rect x="2.00" y="11.00" height="2.00" width="2.00" style="display:inline;fill:#000000;fill-opacity:1;stroke:none;stroke-width:1.0;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:0.00"/>		
			<rect x="8.00" y="11.00" height="2.00" width="2.00" style="display:inline;fill:#000000;fill-opacity:1;stroke:none;stroke-width:1.0;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:0.00"/>
		</symbol>
	</defs>
	
	<g id="background">
