			<line x1="64.00" y1="0.00" x2="64.00" y2="240.00" stroke="#000000" stroke-width="9.00" />			
			<line x1="80.00" y1="0.00" x2="80.00" y2="240.00" stroke="#000000" stroke-width="5.00" />
			<line x1="160.00" y1="0.00" x2="160.00" y2="240.00" stroke="#000000" stroke-width="5.00" />
			<line x1="176.00" y1="0.00" x2="176.00" y2="240.00" stroke="#000000" stroke-width="9.00" />			
