	<text id="Firepower" x="11" y="43.00" style="font-size:12px;font-style:normal;font-variant:normal;font-weight:bold;font-stretch:semi-expanded;text-anchor:middle;fill:black;fill-opacity:1;font-family:Nimbus Sans L">5</text>
	<line id="Dash1" x1="15.50" y1="40.00" x2="19.50" y2="40.00" style="stroke:black; stroke-width:1.5"/>
	<text id="SmokeExponent" x="17.25" y="38.50" style="font-size:8px;font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;text-anchor:middle;fill:black;fill-opacity:1;font-family:Nimbus Sans L">2</text>
	<text id="Range" x="24" y="43.00" style="font-size:12px;font-style:normal;font-variant:normal;font-weight:bold;font-stretch:semi-expanded;text-anchor:middle;fill:black;fill-opacity:1;font-family:Nimbus Sans L">5</text>
	<line id="SprayingFire" x1="20.75" y1="45.00" x2="27.25" y2="45.00" style="stroke:black; stroke-width:1.25"/>
	<line id="dash2" x1="28.50" y1="40.00" x2="32.50" y2="40.00" style="stroke:black; stroke-width:1.5"/>
	<text id="Morale" x="37" y="43.00" style="font-size:12px;font-style:normal;font-variant:normal;font-weight:bold;font-stretch:semi-expanded;text-anchor:middle;fill:black;fill-opacity:1;font-family:Nimbus Sans L">8</text>
	<line id="ELR" x1="33.75" y1="45.00" x2="40.25" y2="45.00" style="stroke:black; stroke-width:1.25"/>
