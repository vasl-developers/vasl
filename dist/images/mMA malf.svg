	<defs id="fonts">
		<style>
			@font-face {
				font-family: Nimbus Sans L;
				font-weight: normal;
				font-style: normal;
				src: url("fonts/NimbusSanL-Reg.ttf") format("ttf");
			}
			@font-face {
				font-family: Nimbus Sans L;
				font-weight: bold;
				font-style: normal;
				src: url("fonts/NimbusSanL-Bol.ttf") format("ttf");
			}
			@font-face {
				font-family: Nimbus Sans L;
				font-weight: normal;
				font-style: italic;
				src: url("fonts/NimbusSanL-RegIta.ttf") format("ttf");
			}
			@font-face {
				font-family: Nimbus Sans L;
				font-weight: bold;
				font-style: italic;
				src: url("fonts/NimbusSanL-BolIta.ttf") format("ttf");
			}
		</style>
	</defs>
	<rect x="0.00" y="0.00" width="28.00" height="12.00" ry="2.00" rx="2.00" style="fill:#ff0000;stroke:none"/>
	
	<text x="50%" y="10.50" style="font-size:13px;font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;text-anchor:middle;fill:#000000;fill-opacity:1;font-family:Nimbus Sans L">MA</text>

