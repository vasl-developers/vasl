<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="28" height="12" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
	<!--
		Name:		mMA X
		Version:	0.1

		Author(s): Gordon Molek, Klas Malmström, Alan Bills
		Tester(s): Alan Bills, Alan Cannamore, Doug Rimmer
	-->

	<defs id="fonts">
		<style>
			@font-face {
				font-family: Nimbus Sans L;
				font-weight: normal;
				font-style: normal;
				src: url("fonts/NimbusSanL-Reg.ttf") format("ttf");
			}
			@font-face {
				font-family: Nimbus Sans L;
				font-weight: bold;
				font-style: normal;
				src: url("fonts/NimbusSanL-Bol.ttf") format("ttf");
			}
		</style>
	</defs>
	<defs id="clipping">
		<clipPath id="tab_clipping">
			<rect x="0.00" y="0.00" width="28.00" height="12.00" ry="2.00" rx="2.00" style="fill:#ff0000;stroke:none"/>
		</clipPath>	
	</defs>
	
	<rect x="0.00" y="0.00" width="28.00" height="12.00" ry="2.00" rx="2.00" style="fill:#ff0000;stroke:none"/>
	
	<text x="50%" y="10.50" style="font-size:13px;font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;text-anchor:middle;fill:#ffffff;fill-opacity:1;font-family:Nimbus Sans L">MA</text>

	<g id="disabled_x" clip-path="url(#tab_clipping)">
		<line x1="0.00" y1="0.00" x2="28.00" y2="12.00" style="stroke:#000000;stroke-width:1.00"/>
		<line x1="0.00" y1="12.00" x2="28.00" y2="0.00" style="stroke:#000000;stroke-width:1.00"/>
	</g>
	
</svg>
