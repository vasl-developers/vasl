	</defs>
	<image x="2.00" y="-4.00" width="48" height="48" preserveAspectRatio="xMidYMid meet" transform="scale(1.00)" href="svg/Ammo.png" xlink:href="svg/Ammo.png"/>
	
	<text x="44.00" y="10.00" style="font-size:9px;font-style:normal;font-variant:normal;font-weight:bold;font-stretch:condensed;text-anchor:end;fill:#000000;fill-opacity:1;font-family:Nimbus Sans L">Ammo</text>
	<text x="4.00" y="20.00" style="font-size:8px;font-style:normal;font-variant:normal;font-weight:normal;font-stretch:condensed;text-anchor:start;fill:#000000;fill-opacity:1;font-family:Nimbus Sans L">X12</text>
	<text x="44.00" y="20.00" style="font-size:8px;font-style:normal;font-variant:normal;font-weight:bold;font-stretch:condensed;text-anchor:end;fill:#000000;fill-opacity:1;font-family:Nimbus Sans L">All PP</text>
	<text x="44.00" y="44.00" style="font-size:10px;font-style:normal;font-variant:normal;font-weight:bold;font-stretch:condensed;text-anchor:end;fill:#000000;fill-opacity:1;font-family:Nimbus Sans L">36</text>

