	<path id="tab" style="fill:#ff0000" d="M 19,0.01869159 V 8 c 0,0.554 -0.446,1 -1,1 H 2 C 1.446,9 1,8.554 1,8 V 0.01869159 Z"/>
	
	<text x="50%" y="7.00" style="font-size:7px;font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;text-anchor:middle;fill:#ffffff;fill-opacity:1;font-family:Nimbus Sans L">BMG</text>

	<g id="disabled_x" clip-path="url(#tab_clipping)">
		<line x1="1.00" y1="0.00" x2="19.00" y2="8.75" style="stroke:#000000;stroke-width:0.75"/>
		<line x1="1.00" y1="8.75" x2="19.00" y2="0.00" style="stroke:#000000;stroke-width:0.75"/>
